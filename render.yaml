services:
  - type: web
    name: mini-case-tracker-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: yarn && yarn build
    startCommand: yarn start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
